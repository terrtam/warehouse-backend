spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${WMS_DB_URL:jdbc:postgresql://localhost:5432/warehouse}
    username: ${WMS_DB_USERNAME:postgres}
    password: ${WMS_DB_PASSWORD:postgres}
  mail:
    host: ${WMS_SMTP_HOST:localhost}
    port: ${WMS_SMTP_PORT:1025}
    username: ${WMS_SMTP_USERNAME:}
    password: ${WMS_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${WMS_SMTP_AUTH:false}
          starttls:
            enable: ${WMS_SMTP_STARTTLS_ENABLE:false}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

  flyway:
    enabled: true

wms:
  cors:
    allowed-origins: ${WMS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://d2wt5en1aa4ldp.cloudfront.net}
  communication:
    email:
      enabled: ${WMS_COMMUNICATION_EMAIL_ENABLED:false}
      from: ${WMS_EMAIL_FROM:no-reply@warehouse.local}
      blocked-recipient-suffixes:
        - .test
        - .local

jwt:
  # Minimum 32 ASCII chars for HS256. Replace in production.
  secret: ${WMS_JWT_SECRET:dev-secret-change-me-please-32chars}
  expiration-ms: ${WMS_JWT_EXPIRATION_MS:3600000}
